databaseChangeLog:
  - changeSet:
      id: 003-create-slots
      author: bastien
      changes:
        - createTable:
            tableName: slots
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: ends_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: int
                  constraints:
                    nullable: false
        - createIndex:
            tableName: slots
            indexName: idx_slots_starts_at
            columns:
              - column:
                  name: starts_at
        - sql:
            sql: ALTER TABLE slots ADD CONSTRAINT ck_slots_capacity CHECK (capacity > 0)
